name: Build LiquidBouncePro

on:
  push:
    branches: [ main, nextgen ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('src-theme/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Grant permissions to src-theme
        run: sudo chmod -R 777 src-theme

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (skip tests & detekt for fast iteration)
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build -x test -x detekt

      - name: Locate built jar
        id: findjar
        run: |
          set -euo pipefail
          JAR=$(find build/libs -regex '.*liquidbouncepro-[0-9.]*\.jar' | head -n1 || true)
          if [ -z "$JAR" ]; then
            # Fallback: any jar in build/libs that is not a sources/dev jar
            JAR=$(find build/libs -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n1)
          fi
          if [ -z "$JAR" ]; then
            echo "[ERROR] built jar not found in build/libs" >&2
            ls -la build/libs || true
            exit 1
          fi
          echo "jar_path=$JAR" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename $JAR)" >> "$GITHUB_OUTPUT"
          echo "Found JAR: $JAR"

      - name: Upload JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: liquidbouncepro-jar
          path: ${{ steps.findjar.outputs.jar_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Also upload entire build/libs folder (for dev jars)
        uses: actions/upload-artifact@v4
        with:
          name: liquidbouncepro-build-libs
          path: build/libs
          if-no-files-found: warn
          retention-days: 14
